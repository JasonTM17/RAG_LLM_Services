name: Publish Containers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      registry:
        description: "Target container registry"
        required: true
        default: "both"
        type: choice
        options:
          - "both"
          - "dockerhub"
          - "ghcr"
      tag_name:
        description: "Custom tag (leave blank to use git ref)"
        required: false
        default: ""
        type: string
      push:
        description: "Push images to registry (false for dry-run)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-containers-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: "1"

jobs:
  build-and-publish:
    name: Build & Publish Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub credentials
        id: dockerhub-check
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: ${{ steps.dockerhub-check.outputs.available == 'true' && (github.event_name == 'push' || inputs.registry == 'dockerhub' || inputs.registry == 'both') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' || inputs.registry == 'ghcr' || inputs.registry == 'both' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and target registries
        id: meta-calc
        run: |
          REF_TAG="${{ github.ref_name }}"
          INPUT_TAG="${{ inputs.tag_name }}"
          TAG="${INPUT_TAG:-$REF_TAG}"
          CLEAN_TAG="${TAG#v}"
          
          # Convert repository name and dockerhub user to lowercase for valid OCI image naming
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          DOCKERHUB_USER_LOWER=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "clean_tag=${CLEAN_TAG}" >> "$GITHUB_OUTPUT"
          echo "repo_lower=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_user=${DOCKERHUB_USER_LOWER}" >> "$GITHUB_OUTPUT"
          
          SHOULD_PUSH="${{ github.event_name == 'push' || inputs.push }}"
          echo "should_push=${SHOULD_PUSH}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ steps.meta-calc.outputs.should_push == 'true' }}
          tags: |
            ${{ steps.dockerhub-check.outputs.available == 'true' && format('{0}/rag-llm-services-api:{1}', steps.meta-calc.outputs.dockerhub_user, steps.meta-calc.outputs.tag) || '' }}
            ${{ steps.dockerhub-check.outputs.available == 'true' && format('{0}/rag-llm-services-api:latest', steps.meta-calc.outputs.dockerhub_user) || '' }}
            ghcr.io/${{ steps.meta-calc.outputs.repo_lower }}/api:${{ steps.meta-calc.outputs.tag }}
            ghcr.io/${{ steps.meta-calc.outputs.repo_lower }}/api:latest
            ghcr.io/${{ steps.meta-calc.outputs.repo_lower }}/api:sha-${{ github.sha }}

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: ${{ steps.meta-calc.outputs.should_push == 'true' }}
          tags: |
            ${{ steps.dockerhub-check.outputs.available == 'true' && format('{0}/rag-llm-services-worker:{1}', steps.meta-calc.outputs.dockerhub_user, steps.meta-calc.outputs.tag) || '' }}
            ${{ steps.dockerhub-check.outputs.available == 'true' && format('{0}/rag-llm-services-worker:latest', steps.meta-calc.outputs.dockerhub_user) || '' }}
            ghcr.io/${{ steps.meta-calc.outputs.repo_lower }}/worker:${{ steps.meta-calc.outputs.tag }}
            ghcr.io/${{ steps.meta-calc.outputs.repo_lower }}/worker:latest
            ghcr.io/${{ steps.meta-calc.outputs.repo_lower }}/worker:sha-${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ steps.meta-calc.outputs.should_push == 'true' }}
          tags: |
            ${{ steps.dockerhub-check.outputs.available == 'true' && format('{0}/rag-llm-services-web:{1}', steps.meta-calc.outputs.dockerhub_user, steps.meta-calc.outputs.tag) || '' }}
            ${{ steps.dockerhub-check.outputs.available == 'true' && format('{0}/rag-llm-services-web:latest', steps.meta-calc.outputs.dockerhub_user) || '' }}
            ghcr.io/${{ steps.meta-calc.outputs.repo_lower }}/web:${{ steps.meta-calc.outputs.tag }}
            ghcr.io/${{ steps.meta-calc.outputs.repo_lower }}/web:latest
            ghcr.io/${{ steps.meta-calc.outputs.repo_lower }}/web:sha-${{ github.sha }}
