name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "21 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  LLM_PROVIDER: fake
  RUN_DEEPSEEK_LIVE_TESTS: "false"

jobs:
  scans:
    name: Secret, SQL, and dependency scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install workspaces
        run: |
          uv sync --frozen
          pnpm install --frozen-lockfile

      - name: Secret scan
        run: uv run python scripts/secret-scan.py

      - name: SQL parameterization scan
        run: uv run python scripts/sql-parameterization-scan.py

      - name: Dependency scan
        run: uv run python scripts/dependency-scan.py
