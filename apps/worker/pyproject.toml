[project]
name = "rag-llm-services-worker"
version = "0.1.0"
description = "Celery worker runtime for RAG LLM Services ingestion jobs."
authors = [{ name = "Nguyen Tien Son" }]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.6",
    "rag-llm-services-api",
    "rag-llm-services-shared",
    "rag-llm-services-observability",
    "rag-llm-services-embeddings",
]

[tool.uv.sources]
rag-llm-services-api = { workspace = true }
rag-llm-services-shared = { workspace = true }
rag-llm-services-observability = { workspace = true }
rag-llm-services-embeddings = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_llm_services_worker"]
