[alembic]
script_location = %(here)s/src/rag_llm_services_api/db/migrations
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url is intentionally NOT set here: env.py injects it at runtime
# from rag_llm_services_api.core.config, keeping credentials out of this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
