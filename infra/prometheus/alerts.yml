groups:
  - name: rag-platform-observability
    rules:
      - alert: RagApiHighErrorRate
        expr: sum(rate(rag_http_requests_total{status_class="5xx"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: RAG API is returning server errors

      - alert: RagWorkerFailures
        expr: sum(rate(rag_worker_jobs_total{status="failed"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: RAG worker ingestion jobs are failing

      - alert: RagQueueDepthGrowing
        expr: rag_worker_queue_depth > 100
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: RAG ingestion queue depth is high

      - alert: RagLlmProviderFailures
        expr: sum(rate(rag_llm_requests_total{status="failed"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: RAG LLM provider requests are failing
