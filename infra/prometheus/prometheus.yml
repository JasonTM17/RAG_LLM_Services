global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rag-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000
        labels:
          component: api

  - job_name: rag-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:9108
        labels:
          component: worker

  - job_name: n8n
    metrics_path: /metrics
    static_configs:
      - targets:
          - n8n:5678
        labels:
          component: automation

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          component: postgres

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          component: redis

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          component: containers
