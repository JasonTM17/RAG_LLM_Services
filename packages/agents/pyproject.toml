[project]
name = "rag-llm-services-agents"
version = "0.1.0"
description = "Agent orchestration package for RAG LLM Services."
authors = [{ name = "Nguyen Tien Son" }]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "openai-agents>=0.3",
    "pydantic>=2.9",
    "rag-llm-services-observability",
    "rag-llm-services-llm",
    "rag-llm-services-rag",
]

[tool.uv.sources]
rag-llm-services-observability = { workspace = true }
rag-llm-services-llm = { workspace = true }
rag-llm-services-rag = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_llm_services_agents"]
