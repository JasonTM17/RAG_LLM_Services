[project]
name = "rag-llm-services-embeddings"
version = "0.1.0"
description = "Embedding provider protocol and BGE-M3/Fake implementations for RAG LLM Services."
authors = [{ name = "Nguyen Tien Son" }]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "rag-llm-services-shared",
]

[tool.uv.sources]
rag-llm-services-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_llm_services_embeddings"]
