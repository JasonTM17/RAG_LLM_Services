[project]
name = "rag-llm-services-rag"
version = "0.1.0"
description = "Document parsing, text normalization, and semantic chunking for RAG LLM Services."
requires-python = ">=3.13"
dependencies = [
    "pypdf>=5.0",
    "python-docx>=1.1.0",
    "rag-llm-services-shared",
]

[tool.uv.sources]
rag-llm-services-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_llm_services_rag"]
