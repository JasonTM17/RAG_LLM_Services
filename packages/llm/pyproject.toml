[project]
name = "rag-llm-services-llm"
version = "0.1.0"
description = "LLM provider gateway and DeepSeek-compatible adapters for RAG LLM Services."
authors = [{ name = "Nguyen Tien Son" }]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "rag-llm-services-shared",
]

[tool.uv.sources]
rag-llm-services-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_llm_services_llm"]
