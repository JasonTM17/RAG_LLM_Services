services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: rag-llm-services-api:local
    container_name: rag_api
    profiles: ["api"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      RAG_DEV_AUTH_ENABLED: ${RAG_DEV_AUTH_ENABLED:-true}
      RAG_DEV_USER_ID: ${RAG_DEV_USER_ID:-00000000-0000-0000-0000-000000000001}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://rag_app:replace-with-local-password@postgres:5432/rag_llm_services}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      RATE_LIMIT_REQUESTS_PER_WINDOW: ${RATE_LIMIT_REQUESTS_PER_WINDOW:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      QUEUE_PROVIDER: ${QUEUE_PROVIDER:-celery}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      INGESTION_QUEUE_NAME: ${INGESTION_QUEUE_NAME:-ingestion}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-replace-with-local-minio-access-key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-replace-with-local-minio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-rag-documents}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-replace-with-your-deepseek-api-key}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_API_MODE: ${DEEPSEEK_API_MODE:-responses}
      DEEPSEEK_ALLOW_CHAT_COMPLETIONS_FALLBACK: ${DEEPSEEK_ALLOW_CHAT_COMPLETIONS_FALLBACK:-false}
      DEEPSEEK_FALLBACK_REASON: ${DEEPSEEK_FALLBACK_REASON:-}
      DEEPSEEK_MAX_RETRIES: ${DEEPSEEK_MAX_RETRIES:-2}
      DEEPSEEK_RETRY_BACKOFF_SECONDS: ${DEEPSEEK_RETRY_BACKOFF_SECONDS:-0.25}
      DEEPSEEK_ESTIMATED_INPUT_CACHE_MISS_USD_PER_1M: ${DEEPSEEK_ESTIMATED_INPUT_CACHE_MISS_USD_PER_1M:-0.00}
      DEEPSEEK_ESTIMATED_INPUT_CACHE_HIT_USD_PER_1M: ${DEEPSEEK_ESTIMATED_INPUT_CACHE_HIT_USD_PER_1M:-0.00}
      DEEPSEEK_ESTIMATED_OUTPUT_USD_PER_1M: ${DEEPSEEK_ESTIMATED_OUTPUT_USD_PER_1M:-0.00}
      RUN_DEEPSEEK_LIVE_TESTS: ${RUN_DEEPSEEK_LIVE_TESTS:-false}
      LLM_MAX_INPUT_TOKENS: ${LLM_MAX_INPUT_TOKENS:-12000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}
      LLM_DAILY_ESTIMATED_COST_LIMIT_USD: ${LLM_DAILY_ESTIMATED_COST_LIMIT_USD:-5.00}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-60}
      RAG_CONTEXT_TOKEN_BUDGET: ${RAG_CONTEXT_TOKEN_BUDGET:-6000}
      RAG_VECTOR_TOP_K: ${RAG_VECTOR_TOP_K:-10}
      RAG_KEYWORD_TOP_K: ${RAG_KEYWORD_TOP_K:-10}
      RAG_RERANK_TOP_K: ${RAG_RERANK_TOP_K:-8}
      RAG_RRF_K: ${RAG_RRF_K:-60}
      RAG_RRF_VECTOR_WEIGHT: ${RAG_RRF_VECTOR_WEIGHT:-1.0}
      RAG_RRF_KEYWORD_WEIGHT: ${RAG_RRF_KEYWORD_WEIGHT:-1.0}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-bge-m3}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-bge}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      OPENAI_TRACING_DISABLED: ${OPENAI_TRACING_DISABLED:-true}
      AGENT_TOOL_MAX_RESULTS: ${AGENT_TOOL_MAX_RESULTS:-5}
      AGENT_TOOL_MAX_CONTEXT_CHUNKS: ${AGENT_TOOL_MAX_CONTEXT_CHUNKS:-5}
      AGENT_TOOL_MAX_CHUNK_CHARS: ${AGENT_TOOL_MAX_CHUNK_CHARS:-1200}
      AGENT_TOOL_MAX_CONTEXT_CHARS: ${AGENT_TOOL_MAX_CONTEXT_CHARS:-6000}
      AGENT_TOOL_MAX_DOCUMENTS: ${AGENT_TOOL_MAX_DOCUMENTS:-20}
      AGENT_HISTORY_MAX_MESSAGES: ${AGENT_HISTORY_MAX_MESSAGES:-8}
      AGENT_HISTORY_MAX_CHARS: ${AGENT_HISTORY_MAX_CHARS:-12000}
      EVAL_DATASET_PATH: ${EVAL_DATASET_PATH:-evals/datasets/baseline-learning-rag.jsonl}
      EVAL_REPORTS_DIR: ${EVAL_REPORTS_DIR:-evals/reports/local}
      EVAL_TOP_K: ${EVAL_TOP_K:-5}
      EVAL_RETRIEVAL_HIT_RATE_THRESHOLD: ${EVAL_RETRIEVAL_HIT_RATE_THRESHOLD:-1.0}
      EVAL_RECALL_AT_K_THRESHOLD: ${EVAL_RECALL_AT_K_THRESHOLD:-0.8}
      EVAL_MRR_THRESHOLD: ${EVAL_MRR_THRESHOLD:-0.8}
      EVAL_NDCG_AT_K_THRESHOLD: ${EVAL_NDCG_AT_K_THRESHOLD:-0.8}
      EVAL_CONTEXT_RELEVANCE_THRESHOLD: ${EVAL_CONTEXT_RELEVANCE_THRESHOLD:-0.5}
      EVAL_ANSWER_RELEVANCE_THRESHOLD: ${EVAL_ANSWER_RELEVANCE_THRESHOLD:-0.65}
      EVAL_CITATION_CORRECTNESS_THRESHOLD: ${EVAL_CITATION_CORRECTNESS_THRESHOLD:-1.0}
      EVAL_CITATION_RECALL_THRESHOLD: ${EVAL_CITATION_RECALL_THRESHOLD:-0.8}
      EVAL_FAITHFULNESS_THRESHOLD: ${EVAL_FAITHFULNESS_THRESHOLD:-0.6}
      EVAL_RUN_STALE_AFTER_SECONDS: ${EVAL_RUN_STALE_AFTER_SECONDS:-3600}
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        RAG_BACKEND_ORIGIN: ${RAG_BACKEND_ORIGIN:-http://api:8000}
    image: rag-llm-services-web:local
    container_name: rag_web
    profiles: ["web"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      RAG_BACKEND_ORIGIN: ${RAG_BACKEND_ORIGIN:-http://api:8000}
    ports:
      - "${WEB_PORT:-3001}:3000"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_llm_services}
      POSTGRES_USER: ${POSTGRES_USER:-rag_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_app} -d ${POSTGRES_DB:-rag_llm_services}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: rag_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-replace-with-local-minio-access-key}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-replace-with-local-minio-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-create-bucket:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: rag_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-replace-with-local-minio-access-key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-replace-with-local-minio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-rag-documents}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      /usr/bin/mc mb --ignore-existing local/$${MINIO_BUCKET};
      exit 0;
      "

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: rag-llm-services-worker:local
    container_name: rag_worker
    profiles: ["worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://rag_app:replace-with-local-password@postgres:5432/rag_llm_services}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QUEUE_PROVIDER: ${QUEUE_PROVIDER:-celery}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      INGESTION_QUEUE_NAME: ${INGESTION_QUEUE_NAME:-ingestion}
      INGESTION_TASK_MAX_RETRIES: ${INGESTION_TASK_MAX_RETRIES:-3}
      INGESTION_TASK_RETRY_BACKOFF_SECONDS: ${INGESTION_TASK_RETRY_BACKOFF_SECONDS:-5}
      INGESTION_TASK_RETRY_BACKOFF_MAX_SECONDS: ${INGESTION_TASK_RETRY_BACKOFF_MAX_SECONDS:-300}
      INGESTION_TASK_RETRY_JITTER: ${INGESTION_TASK_RETRY_JITTER:-true}
      QUEUE_VISIBILITY_TIMEOUT_SECONDS: ${QUEUE_VISIBILITY_TIMEOUT_SECONDS:-3600}
      WORKER_POOL: ${WORKER_POOL:-threads}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-replace-with-local-minio-access-key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-replace-with-local-minio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-rag-documents}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-bge-m3}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EVAL_DATASET_PATH: ${EVAL_DATASET_PATH:-evals/datasets/baseline-learning-rag.jsonl}
      EVAL_REPORTS_DIR: ${EVAL_REPORTS_DIR:-evals/reports/local}
      EVAL_TOP_K: ${EVAL_TOP_K:-5}
      EVAL_RETRIEVAL_HIT_RATE_THRESHOLD: ${EVAL_RETRIEVAL_HIT_RATE_THRESHOLD:-1.0}
      EVAL_RECALL_AT_K_THRESHOLD: ${EVAL_RECALL_AT_K_THRESHOLD:-0.8}
      EVAL_MRR_THRESHOLD: ${EVAL_MRR_THRESHOLD:-0.8}
      EVAL_NDCG_AT_K_THRESHOLD: ${EVAL_NDCG_AT_K_THRESHOLD:-0.8}
      EVAL_CONTEXT_RELEVANCE_THRESHOLD: ${EVAL_CONTEXT_RELEVANCE_THRESHOLD:-0.5}
      EVAL_ANSWER_RELEVANCE_THRESHOLD: ${EVAL_ANSWER_RELEVANCE_THRESHOLD:-0.65}
      EVAL_CITATION_CORRECTNESS_THRESHOLD: ${EVAL_CITATION_CORRECTNESS_THRESHOLD:-1.0}
      EVAL_CITATION_RECALL_THRESHOLD: ${EVAL_CITATION_RECALL_THRESHOLD:-0.8}
      EVAL_FAITHFULNESS_THRESHOLD: ${EVAL_FAITHFULNESS_THRESHOLD:-0.6}
      EVAL_RUN_STALE_AFTER_SECONDS: ${EVAL_RUN_STALE_AFTER_SECONDS:-3600}
      WORKER_METRICS_ENABLED: ${WORKER_METRICS_ENABLED:-true}
      WORKER_METRICS_HOST: ${WORKER_METRICS_HOST:-0.0.0.0}
      WORKER_METRICS_PORT: 9108
    ports:
      - "${WORKER_METRICS_HOST_PORT:-9108}:9108"

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.37.11}
    container_name: rag_n8n
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-replace-with-local-n8n-encryption-key}
      N8N_METRICS: ${N8N_METRICS:-true}
      N8N_METRICS_INCLUDE_DEFAULT_METRICS: ${N8N_METRICS_INCLUDE_DEFAULT_METRICS:-true}
      N8N_METRICS_INCLUDE_QUEUE_METRICS: ${N8N_METRICS_INCLUDE_QUEUE_METRICS:-true}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Bangkok}
      RAG_API_BASE_URL: ${RAG_API_BASE_URL:-http://host.docker.internal:8000/api/v1}
      RAG_WORKFLOW_OWNER_ID: ${RAG_WORKFLOW_OWNER_ID:-00000000-0000-0000-0000-000000000001}
      N8N_NOTIFICATION_WEBHOOK_URL: ${N8N_NOTIFICATION_WEBHOOK_URL:-}
      N8N_STUDY_TOPIC: ${N8N_STUDY_TOPIC:-RAG fundamentals}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.55.1}
    container_name: rag_prometheus
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      n8n:
        condition: service_started
      postgres-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.1}
    container_name: rag_grafana
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-replace-with-local-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/opt/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

  postgres-exporter:
    image: ${POSTGRES_EXPORTER_IMAGE:-quay.io/prometheuscommunity/postgres-exporter:v0.15.0}
    container_name: rag_postgres_exporter
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-rag_app}:${POSTGRES_PASSWORD:-replace-with-local-password}@postgres:5432/${POSTGRES_DB:-rag_llm_services}?sslmode=disable"
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"

  redis-exporter:
    image: ${REDIS_EXPORTER_IMAGE:-oliver006/redis_exporter:v1.62.0}
    container_name: rag_redis_exporter
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command:
      - "--redis.addr=redis://redis:6379"
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"

  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.49.1}
    container_name: rag_cadvisor
    profiles: ["container-observability"]
    restart: unless-stopped
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
  n8n_data:
  prometheus_data:
  grafana_data:
