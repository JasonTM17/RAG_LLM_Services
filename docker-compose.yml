services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_llm_services}
      POSTGRES_USER: ${POSTGRES_USER:-rag_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_app} -d ${POSTGRES_DB:-rag_llm_services}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: rag_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-replace-with-local-minio-access-key}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-replace-with-local-minio-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-create-bucket:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: rag_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-replace-with-local-minio-access-key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-replace-with-local-minio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-rag-documents}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      /usr/bin/mc mb --ignore-existing local/$${MINIO_BUCKET};
      exit 0;
      "

  worker:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    container_name: rag_worker
    profiles: ["worker"]
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://rag_app:replace-with-local-password@postgres:5432/rag_llm_services}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QUEUE_PROVIDER: ${QUEUE_PROVIDER:-celery}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      INGESTION_QUEUE_NAME: ${INGESTION_QUEUE_NAME:-ingestion}
      INGESTION_TASK_MAX_RETRIES: ${INGESTION_TASK_MAX_RETRIES:-3}
      INGESTION_TASK_RETRY_BACKOFF_SECONDS: ${INGESTION_TASK_RETRY_BACKOFF_SECONDS:-5}
      INGESTION_TASK_RETRY_BACKOFF_MAX_SECONDS: ${INGESTION_TASK_RETRY_BACKOFF_MAX_SECONDS:-300}
      INGESTION_TASK_RETRY_JITTER: ${INGESTION_TASK_RETRY_JITTER:-true}
      QUEUE_VISIBILITY_TIMEOUT_SECONDS: ${QUEUE_VISIBILITY_TIMEOUT_SECONDS:-3600}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-replace-with-local-minio-access-key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-replace-with-local-minio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-rag-documents}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-bge-m3}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
    volumes:
      - .:/app
    command: >
      sh -c "uv sync --frozen &&
      uv run celery -A rag_llm_services_worker.main:celery_app worker
      --loglevel=INFO
      --queues=$${INGESTION_QUEUE_NAME:-ingestion}"

volumes:
  postgres_data:
  redis_data:
  minio_data:
