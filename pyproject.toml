[project]
name = "rag-llm-services"
version = "0.1.0"
description = "RAG LLM Services production platform: uv workspace root."
authors = [{ name = "Nguyen Tien Son" }]
license = "MIT"
keywords = ["rag", "llm", "deepseek", "fastapi", "n8n", "embeddings", "pgvector"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.13"
# Deviation note: members are declared as root dependencies so that plain
# `uv sync` / `uv run` install the whole workspace; with an empty dependency
# list uv strips members on every plain sync and the verify commands break.
dependencies = [
    "rag-llm-services-api",
    "rag-llm-services-shared",
    "rag-llm-services-observability",
    "rag-llm-services-rag",
    "rag-llm-services-embeddings",
    "rag-llm-services-llm",
    "rag-llm-services-agents",
    "rag-llm-services-worker",
]

[project.urls]
Repository = "https://github.com/JasonTM17/RAG_LLM_Services"
Issues = "https://github.com/JasonTM17/RAG_LLM_Services/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.13", "mypy>=1.18", "aiosqlite>=0.20"]


[tool.uv.workspace]
members = [
    "apps/api",
    "packages/shared",
    "packages/observability",
    "packages/rag",
    "packages/embeddings",
    "packages/llm",
    "packages/agents",
    "apps/worker",
]

[tool.uv.sources]
rag-llm-services-api = { workspace = true }
rag-llm-services-shared = { workspace = true }
rag-llm-services-observability = { workspace = true }
rag-llm-services-rag = { workspace = true }
rag-llm-services-embeddings = { workspace = true }
rag-llm-services-llm = { workspace = true }
rag-llm-services-agents = { workspace = true }
rag-llm-services-worker = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = [
    "apps/api/src",
    "packages/shared/src",
    "packages/observability/src",
    "packages/rag/src",
    "packages/embeddings/src",
    "packages/llm/src",
    "packages/agents/src",
    "apps/worker/src",
    "evals",
    "tests",
]

[tool.ruff.lint.per-file-ignores]
# Depends() in route defaults is the FastAPI dependency-injection idiom.
"apps/api/src/rag_llm_services_api/api/**" = ["B008"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
